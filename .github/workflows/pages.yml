name: Check and deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check dist/engine.js
          node --check dist/game.js
          node --check dist/battle-fx.js
          node --check dist/progression.js
          node --check dist/campaign.js
          node --check dist/combat-kit.js
          node --check dist/ability-fx.js
          node --check dist/spatial-fx.js
          node --check dist/arcana-audio.js
          node --check dist/campaign-extras.js
      - name: Verify combat and full campaign
        run: |
          node test-engine.cjs
          node test-progression.cjs
          node test-tactics.cjs
          node test-spatial.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: check-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
